<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Resilient Chat Widget</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-alt: #eef0f3;
    --text: #1a1c20;
    --text-muted: #667085;
    --border: #e2e4e9;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --user-bubble: #4f46e5;
    --user-bubble-text: #ffffff;
    --bot-bubble: #eef0f3;
    --bot-bubble-text: #1a1c20;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --radius: 16px;
    --shadow: 0 12px 32px rgba(20, 20, 40, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #1a1d23;
      --surface-alt: #22262e;
      --text: #f1f2f4;
      --text-muted: #9aa1ac;
      --border: #2c313a;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --user-bubble: #4f46e5;
      --user-bubble-text: #ffffff;
      --bot-bubble: #22262e;
      --bot-bubble-text: #f1f2f4;
      --danger: #f87171;
      --danger-bg: #3a1c1c;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  .page {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .page-hint {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }

  /* ---------- Toast (shown when chat is removed) ---------- */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 14px;
    max-width: min(90vw, 420px);
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: 1000;
  }
  #toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  #toast .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger); flex-shrink: 0;
  }

  /* ---------- Chat widget ---------- */
  #chat-widget {
    width: 100%;
    max-width: 420px;
    height: min(640px, 88vh);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  #chat-widget.removing {
    opacity: 0;
    transform: translateY(16px) scale(0.98);
    pointer-events: none;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
    flex-shrink: 0;
  }

  .chat-header .title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    flex-shrink: 0;
  }
  .status-dot.offline {
    background: var(--danger);
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
  }

  .theme-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    animation: msgIn 0.25s ease both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    color: var(--bot-bubble-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error .bubble {
    background: var(--danger-bg);
    color: var(--danger);
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bot-bubble);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: typingBounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .chat-input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    /* keeps input above mobile virtual keyboards / home indicator */
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }

  #chat-input {
    flex: 1;
    resize: none;
    max-height: 120px;
    min-height: 40px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px; /* close to 16px to avoid iOS auto-zoom while staying compact */
    font-family: inherit;
    outline: none;
    line-height: 1.4;
  }
  #chat-input:focus {
    border-color: var(--accent);
  }

  #send-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:active:not(:disabled) { transform: scale(0.94); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Mobile-first tweaks */
  @media (max-width: 480px) {
    .page { padding: 0; }
    #chat-widget {
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      border: none;
    }
    .page-hint { display: none; }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="page-hint">Resilient Chat Widget demo — Gemini → OpenRouter failover</div>

<div class="page">
  <div id="chat-widget">
    <div class="chat-header">
      <div class="title">
        <span class="status-dot" id="statusDot"></span>
        <span>Assistant</span>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">Toggle theme</button>
    </div>

    <div class="chat-log" id="chatLog">
      <div class="msg bot">
        <div class="bubble">Hi! Ask me anything — I'll automatically switch providers behind the scenes if one is unavailable.</div>
      </div>
    </div>

    <div class="chat-input-row">
      <textarea id="chat-input" rows="1" placeholder="Type a message…" aria-label="Chat message"></textarea>
      <button id="send-btn" type="button" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.5L21 3L13.5 21L10.5 13.5L3 11.5Z" stroke="white" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="toast">
  <span class="dot"></span>
  <span id="toastText">Chat is temporarily unavailable — please check back soon.</span>
</div>

<script>
(function () {
  "use strict";

  // ---- Configuration ----
  // Point this at your deployed Cloudflare Worker.
  const WORKER_URL = "https://silent-sea-bd9b.ankitpandeycs.workers.dev";
  const CHAT_ENDPOINT = `${WORKER_URL}/api/chat`;
  const STATUS_ENDPOINT = `${WORKER_URL}/api/status`;
  const STATUS_POLL_MS = 60000; // re-check availability every 60s while hidden

  const widget = document.getElementById("chat-widget");
  const chatLog = document.getElementById("chatLog");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");
  const statusDot = document.getElementById("statusDot");
  const themeToggle = document.getElementById("themeToggle");
  const toast = document.getElementById("toast");
  const toastText = document.getElementById("toastText");
  const pageContainer = document.querySelector(".page");

  let history = [];
  let isSending = false;
  let widgetRemoved = false;
  let pollHandle = null;

  // ---------- Theme toggle (manual override of prefers-color-scheme) ----------
  themeToggle.addEventListener("click", () => {
    const current = document.documentElement.style.colorScheme || "light dark";
    document.documentElement.style.colorScheme =
      current === "light" ? "dark" : current === "dark" ? "light" : "light";
  });

  // ---------- Auto-resizing textarea ----------
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  sendBtn.addEventListener("click", handleSend);

  function scrollToBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function appendMessage(role, text) {
    const wrapper = document.createElement("div");
    wrapper.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrapper.appendChild(bubble);
    chatLog.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  function showTypingIndicator() {
    const wrapper = document.createElement("div");
    wrapper.className = "msg bot";
    wrapper.id = "typingIndicator";
    wrapper.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    chatLog.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  function removeTypingIndicator() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  function showToast(message) {
    toastText.textContent = message;
    toast.classList.add("visible");
  }

  function hideToast() {
    toast.classList.remove("visible");
  }

  /**
   * Smoothly fades out and removes the widget from the DOM,
   * then shows a toast explaining why.
   */
  function removeWidget(message) {
    if (widgetRemoved) return;
    widgetRemoved = true;

    widget.classList.add("removing");
    showToast(message || "Chat is temporarily unavailable — please check back soon.");

    setTimeout(() => {
      if (widget.parentNode) {
        widget.parentNode.removeChild(widget);
      }
    }, 420); // matches CSS transition duration
  }

  /**
   * Re-inserts the widget if it had been removed and a provider
   * becomes available again.
   */
  function restoreWidgetIfNeeded() {
    if (!widgetRemoved) return;
    widgetRemoved = false;
    widget.classList.remove("removing");
    pageContainer.appendChild(widget);
    hideToast();
    // Force reflow so the transition plays on re-entry.
    void widget.offsetWidth;
  }

  async function checkAvailability() {
    try {
      const res = await fetch(STATUS_ENDPOINT, { cache: "no-store" });
      if (!res.ok) return false;
      const data = await res.json();
      return !!data.available;
    } catch {
      return false;
    }
  }

  function setStatusDot(online) {
    statusDot.classList.toggle("offline", !online);
  }

  async function refreshAvailability() {
    const available = await checkAvailability();
    setStatusDot(available);
    if (available) {
      restoreWidgetIfNeeded();
    } else if (!widgetRemoved) {
      removeWidget("Chat is temporarily unavailable — please check back soon.");
    }
  }

  function startAvailabilityPolling() {
    if (pollHandle) return;
    pollHandle = setInterval(refreshAvailability, STATUS_POLL_MS);
  }

  async function handleSend() {
    const text = input.value.trim();
    if (!text || isSending || widgetRemoved) return;

    appendMessage("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    input.style.height = "auto";

    isSending = true;
    sendBtn.disabled = true;
    showTypingIndicator();

    try {
      const res = await fetch(CHAT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history }),
      });

      removeTypingIndicator();

      if (res.status === 503) {
        const data = await res.json().catch(() => ({}));
        if (data.error === "ALL_MODELS_EXHAUSTED" || data.hide_chat) {
          removeWidget("All chat providers are currently exhausted. Please check back later.");
          return;
        }
      }

      if (!res.ok) {
        appendMessage("error", "Something went wrong. Please try again in a moment.");
        return;
      }

      const data = await res.json();
      const reply = data.reply || "Sorry, I couldn't generate a response.";
      appendMessage("bot", reply);
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      removeTypingIndicator();
      appendMessage("error", "Network error reaching the assistant. Please try again.");
    } finally {
      isSending = false;
      sendBtn.disabled = false;
    }
  }

  // ---------- Initial boot ----------
  refreshAvailability();
  startAvailabilityPolling();
})();
</script>
</body>
</html>
