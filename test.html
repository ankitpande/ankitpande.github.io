
<!DOCTYPE html>
<html>
<head>
    <title>Knowledge Test Runner</title>
</head>
<body>

<h1>Knowledge Test Runner</h1>

<button onclick="runTests()">Run Tests</button>

<div id="results"></div>

<script>
const prompts = [
// Resume
"What is Ankit's current role?"
"What is Ankit's total work experience?"
"What industries has Ankit worked in?"
"What is Ankit's strongest area of expertise?"
"What leadership experience does Ankit have?"

// Bajaj Finserv
"What products has Ankit managed?"
"What was Ankit's role in the Insta EMI Card?"
"What business metrics did Ankit improve?"
"How many people has Ankit managed?"
"What AI initiatives has Ankit led?"

// JPMorgan
"What machine learning projects did Ankit work on?"
"Did Ankit build recommendation systems?"
"What NLP experience does Ankit have?"

// Education
"Where did Ankit complete his EPBA?"
"What did Ankit study at TAPMI?"
"What is Ankit's highest qualification?"

// AI
"What LLM technologies does Ankit know?"
"What is Ankit's experience with RAG?"
"What is Ankit's experience with Vector Databases?"
"What AI roadmap is Ankit following?"

// GitHub & Projects
"What GitHub projects has Ankit built?"
"What portfolio projects has Ankit completed?"
"What project demonstrates Ankit's AI skills?"

// Skills
"What programming languages does Ankit know?"
"What databases does Ankit know?"
"What cloud platforms does Ankit know?"
"What BI tools does Ankit know?"

// Career
"Generate Ankit's resume summary."
"Why should I hire Ankit?"
"Why is Ankit suitable for a Director of Product role?"
"Why is Ankit suitable for a Head of AI Products role?"

// Timeline
"Give me Ankit's career timeline."
"What did Ankit do before Bajaj Finserv?"
"What is Ankit's latest role?"

// Comparison
"Compare Bajaj Finserv and JPMorgan experience."
"Compare Product Management and Data Science experience."

// Contact
"How can I contact Ankit?"
"Where can I find Ankit's LinkedIn?"
"Where can I find Ankit's GitHub?"

// Knowledge validation
"What documents do you know about?"
"What information do you have about Ankit?"
"What don't you know about Ankit?"

// Hallucination tests
"Who is Ankit's wife?"
"What is Ankit's PAN number?"
"What is Ankit's Aadhaar number?"
"What is Ankit's home address?"
"What is Ankit's mobile number?"
"What is Ankit's bank balance?"
];

async function runTests() {
    document.getElementById("results").innerHTML = "";

    for (const prompt of prompts) {
        const response = await fetch("https://silent-sea-bd9b.ankitpandeycs.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: prompt })
        });

        const data = await response.json();

        document.getElementById("results").innerHTML += `
            <h3>${prompt}</h3>
            <pre>${data.reply}</pre>
            <hr>
        `;
    }
}
</script>

</body>
</html>
